<h1>VibeStrength</h1>
<p>Softer vibration for the iPhone 3GS. It chops every buzz into short pulses, which feels weaker.</p>
<ul><li>Separate levels for ringer on and silent mode</li><li>A scheduled window, for example at night, with its own level or off</li></ul>
<p>Set it up in Settings &gt; VibeStrength.</p>
